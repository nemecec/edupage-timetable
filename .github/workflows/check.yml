name: check

on:
  push:
    branches: [main]
    paths: ["tt.py", "deploy/**", ".github/workflows/**"]
  pull_request:
    paths: ["tt.py", "deploy/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything that can be judged without leaving the runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile
        run: python3 -m compileall -q tt.py deploy/publish.py
      - name: Lint the templates
        run: |
          pip install --quiet cfn-lint
          cfn-lint deploy/dns.yaml deploy/site.yaml --region us-east-1

  # One fetch, two builds, compared. Nothing is committed to make this hermetic:
  # the API responses are an output, not source, and an Actions cache is evicted
  # after a week of quiet — a fixture that can vanish is worse than none.
  #
  # Only one timetable is fetched. The determinism this is checking does not
  # need four, and the school's server is someone else's, asked for nothing more
  # than necessary on every push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build twice from one fetch and compare
        run: |
          python3 tt.py --only ProTERA --class 8 -o one.html    # fetches, caches
          python3 tt.py --only ProTERA --class 8 -o two.html    # reuses the cache
          cmp one.html two.html
          echo "deterministic: $(wc -c < one.html) bytes"

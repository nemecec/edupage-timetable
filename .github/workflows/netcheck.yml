name: netcheck
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can this runner reach EduPage at all?
        run: |
          echo "--- runner egress address ---"
          curl -s --max-time 10 https://api.ipify.org || echo "(no ipify)"; echo
          echo "--- control: a host we know answers ---"
          curl -s -o /dev/null -w "example.com %{http_code} in %{time_total}s\n" \
            --max-time 15 https://example.com || echo "control FAILED"
          echo "--- dns ---"
          getent ahosts tera.edupage.org || true
          echo "--- tera.edupage.org over IPv4 ---"
          curl -4 -s -o /dev/null -w "  %{http_code} in %{time_total}s\n" \
            --max-time 20 https://tera.edupage.org/timetable/view.php || echo "  IPv4 FAILED ($?)"
          echo "--- tcp reachability ---"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/148.251.77.16/443' \
            && echo "  port 443 open" || echo "  port 443 unreachable"

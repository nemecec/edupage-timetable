name: publish

# The nightly rebuild lives in AWS, on an EventBridge schedule, because GitHub
# switches a scheduled workflow off after sixty days without repository
# activity — and a page that only needs rebuilding, never editing, would reach
# that. This is the button for when you do not want to wait for tonight.
#
# It holds no key. The job exchanges a short-lived OIDC token for a role that
# can do exactly one thing: ask that function to run.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Is there somewhere to publish to?
        id: ready
        env:
          ROLE: ${{ secrets.AWS_PUBLISH_ROLE }}
          FUNCTION: ${{ secrets.AWS_BUILD_FUNCTION }}
        run: |
          # Both, or neither: with only the role set, the invoke below asks for
          # a function called "" and fails somewhere much less obvious.
          if [ -n "$ROLE" ] && [ -n "$FUNCTION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_PUBLISH_ROLE and AWS_BUILD_FUNCTION are not both set — skipping. Run deploy/deploy.sh secrets."
          fi

      - name: Where does the site live?
        id: conf
        if: steps.ready.outputs.ready == 'true'
        run: |
          # Read, not sourced: site.conf is a settings file, and `.` would run
          # whatever a branch happened to put in it.
          region=$(grep -m1 '^REGION=' deploy/site.conf | cut -d= -f2)
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5
        if: steps.ready.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE }}
          aws-region: ${{ steps.conf.outputs.region }}

      - name: Ask for a rebuild
        if: steps.ready.outputs.ready == 'true'
        env:
          # Through the environment, not interpolated into the script: a
          # secret is still a string someone typed, and `${{ }}` pastes it
          # into the shell before the shell ever sees a quote.
          FUNCTION: ${{ secrets.AWS_BUILD_FUNCTION }}
        run: |
          aws lambda invoke --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --log-type Tail --query LogResult --output text out.json | base64 -d | tail -6
          echo "---"
          cat out.json; echo
          python3 -c "import json,sys; d=json.load(open('out.json')); sys.exit(0 if d.get('ok') else 1)"

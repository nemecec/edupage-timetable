name: publish

# The school changes its timetable a few times a year, so a nightly check is
# generous. The build is deterministic: an unchanged timetable renders identical
# bytes and publishes nothing, so most runs end without touching the site.
on:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
    paths: ["tt.py", "deploy/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # to exchange for AWS credentials; nothing is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Before the AWS side exists there is nothing to publish into, and a red
      # cross on a repository that is merely not deployed yet says nothing
      # useful. Deploy it (see deploy/README.md) and this starts working.
      - name: Is there somewhere to publish to?
        id: ready
        env:
          ROLE: ${{ secrets.AWS_PUBLISH_ROLE }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_PUBLISH_ROLE is not set — skipping. Run deploy/deploy.sh secrets."
          fi

      - uses: actions/setup-python@v6
        if: steps.ready.outputs.ready == 'true'
        with:
          python-version: "3.13"

      - uses: aws-actions/configure-aws-credentials@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE }}
          aws-region: us-east-1

      - name: Build and publish
        if: steps.ready.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.AWS_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION }}
          PREFIX: tera-timetable
          GOATCOUNTER: ${{ vars.GOATCOUNTER_SITE }}
          EDUPAGE: tera
          YEAR: "2026"
          INITIAL_SCHOOL: ProTERA
          INITIAL_CLASS: "8"
          SITE_LANGUAGE: et
        run: python3 deploy/publish.py

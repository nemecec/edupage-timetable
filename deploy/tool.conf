# Where this tool lives on the site. One string in one place, because the copies
# it used to have could drift without anything failing — the page would simply
# appear somewhere other than where it was advertised.
#
# The site itself is a stack of its own, at github.com/nemecec/little-tools. The
# domain and the region below say which one to read the bucket, the distribution
# and the alarm topic out of.
#
# Shell syntax, so deploy.sh can source it; simple KEY=value, so publish.py can
# read it without a parser. An environment variable of the same name wins, for
# trying something out without editing the file.

DOMAIN=little.tools
PREFIX=timetable

# Where the site's bucket and stacks live.
REGION=eu-central-1
